# Copy to docker-compose.yml and an .env next to it (see README.md). There is no prebuilt image in 0.1: build it from a
# checkout. `npm run bundle-skill` (copies the hermes-ui skill + bootstrap message into ./skill, the image needs them),
# then `docker compose up -d --build`.
# The image carries only the bootstrap message: install the skill itself into Hermes too (docs/SELF-HOSTING.md "With
# Docker"), else every answer stays plain text; the startup log says "hermes-ui skill is NOT installed" then.
# Hermes runs in Docker too? Use docker-compose.with-hermes.example.yml instead (one network, 8642 not published).
services:
  bridge:
    build: .
    image: hermes-ui-plus-bridge:local
    restart: unless-stopped
    environment:
      # Where the Hermes API server is reachable FROM THE CONTAINER. If Hermes runs on the Docker host:
      #   http://host.docker.internal:8642  (the extra_hosts entry below makes that work on Linux)
      HERMES_BASE_URL: ${HERMES_BASE_URL:?set HERMES_BASE_URL in .env}
      HERMES_API_KEY: ${HERMES_API_KEY:-}
      # Optional. Empty = a token is generated on first start and kept in the volume.
      BRIDGE_TOKEN: ${BRIDGE_TOKEN:-}
      # The URL your phone uses to reach the bridge (https://... via your reverse proxy / tunnel).
      BRIDGE_PUBLIC_URL: ${BRIDGE_PUBLIC_URL:-}
      BRIDGE_NAME: ${BRIDGE_NAME:-Hermes}
      # HERMES_HOME: /hermes-home   # with the optional Hermes home volume below
      # Set to 1 to pair from another machine: `docker compose logs bridge` shows a path /bridge/pair?code=XXXX-XXXX;
      # that page code works once within 10 minutes, the pair link the page shows works once within 1 hour. Or create a
      # pair link (1 hour) any time:
      #   docker compose exec bridge node bin/hermes-ui-bridge.mjs devices add "Phone"
      BRIDGE_PAIRING: ${BRIDGE_PAIRING:-}
      # Optional web app (PWA): unpack hermes-ui-plus-web-<version>.tar.gz into ./web next to this file
      #   mkdir -p web && tar -xzf hermes-ui-plus-web-<version>.tar.gz -C web --strip-components=1
      # then uncomment this line and the ./web volume below (docs/WEB-APP.md).
      # BRIDGE_WEB_DIR: /web
      # Optional features (leave empty to keep them off)
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    # Uncomment to print the pairing QR code into the container log on start:
    # command: ["--pair"]
    ports:
      - "127.0.0.1:8790:8790"   # publish to loopback only; put TLS in front (reverse proxy, tailscale serve, ...)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - bridge-data:/var/lib/hermes-ui-bridge
      # - ./web:/web:ro   # web app bundle for BRIDGE_WEB_DIR above (read-only)
      # Optional: Hermes' home (data folder), read-only, so the startup check can see whether the hermes-ui skill is
      # installed (Hermes 0.21.5 to 0.22.2 cannot list skills over the API). Uncomment both lines; the path must exist.
      # - ${HOME}/.hermes:/hermes-home:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
volumes:
  bridge-data:
