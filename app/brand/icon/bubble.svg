<!-- Concept B "bubble": mint speech bubble with "H+" cut out, on a deep indigo field.
     Hand-written, 1024 grid; sections are composed by scripts/brand-icons.mjs (see monogram.svg). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
<!--defs--><defs>
  <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#34319A"/>
    <stop offset="1" stop-color="#14143A"/>
  </linearGradient>
  <linearGradient id="bubbleGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#7DF7D6"/>
    <stop offset="1" stop-color="#3FDBB5"/>
  </linearGradient>
  <mask id="cut" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
    <rect width="1024" height="1024" fill="#fff"/>
    <!-- H -->
    <rect x="318" y="372" width="76" height="236" rx="18" fill="#000"/>
    <rect x="504" y="372" width="76" height="236" rx="18" fill="#000"/>
    <rect x="380" y="464" width="140" height="56" fill="#000"/>
    <!-- + -->
    <rect x="644" y="408" width="56" height="168" rx="28" fill="#000"/>
    <rect x="588" y="464" width="168" height="56" rx="28" fill="#000"/>
  </mask>
</defs><!--/defs-->
<!--bg--><g id="bg">
  <rect width="1024" height="1024" fill="url(#bgGrad)"/>
</g><!--/bg-->
<!--mark--><g id="mark">
  <path mask="url(#cut)" fill="url(#bubbleGrad)"
    d="M372 236 H652 A168 168 0 0 1 820 404 V576 A168 168 0 0 1 652 744 H436 L312 832 Q296 843 298 824 L310 740 A168 168 0 0 1 204 576 V404 A168 168 0 0 1 372 236 Z"/>
</g><!--/mark-->
</svg>
