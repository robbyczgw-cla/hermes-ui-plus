# --- Global allow-list for default-rule false positives (keep tiny, target = the matched text only) --------
# i18n key *names* ("a11yKey:'chat.approve.label'") trip the generic-api-key rule in the minified web bundle.
[allowlist]
description = "i18n translation-key properties"
regexTarget = "match"
regexes = [
  '''(?i)\b(?:a11yKey|labelKey|titleKey|descKey|hintKey|placeholderKey|i18nKey)\b\s*['"]?\s*[:=]''',
]
