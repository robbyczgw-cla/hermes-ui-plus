# gitleaks config for Hermes Interactive UI+. Extends the built-in ruleset with our own token shapes.
# Hooks/CI/scan-artifact.sh all pass this file explicitly (--config). See docs/LEAK-GUARD.md.
title = "Hermes Interactive UI+"

[extend]
useDefault = true

# Test-fixture allow-listing is per rule ([[rules.allowlists]], condition AND): the file must be a test/fixture
# path AND the matched secret text must look fake (test/fake/dummy/wrong/... or a run of one repeated char).
# (A global [[allowlists]] block with condition=AND is silently treated as OR by gitleaks 8.30 when extending
# the default ruleset, so it is deliberately not used.) PEM keys are never allow-listed.

# --- Hermes UI+ own token formats --------------------------------------------------------------

[[rules]]
id = "hui-bridge-device-token"
description = "Hermes bridge device token (hbd_ + 32 random bytes, base64url)"
regex = '''\bhbd_[A-Za-z0-9_-]{32,}'''
entropy = 3.2
keywords = ["hbd_"]
[[rules.allowlists]]
description = "Clearly fake test fixture (test path AND fake-looking secret text)"
condition = "AND"
paths = [
  '''(?:^|/)(?:test|tests|__tests__|__fixtures__|fixtures)/''',
  '''\.(?:test|spec)\.[cm]?[jt]sx?$''',
]
regexes = [
  '''(?i)(?:test|fake|dummy|example|sample|placeholder|wrong|not_a_real|invalid|bogus|mock)''',
  '''(?:0{8,}|1{8,}|2{8,}|3{8,}|4{8,}|5{8,}|6{8,}|7{8,}|8{8,}|9{8,}|(?i:x{8,}|z{8,}|a{8,}))''',
]

[[rules]]
id = "hui-adapter-token"
description = "Agent adapter token (nca_ + 32 random bytes, base64url)"
regex = '''\bnca_[A-Za-z0-9_-]{32,}'''
entropy = 3.2
keywords = ["nca_"]

[[rules.allowlists]]
description = "Clearly fake test fixture (test path AND fake-looking secret text)"
condition = "AND"
paths = [
  '''(?:^|/)(?:test|tests|__tests__|__fixtures__|fixtures)/''',
  '''\.(?:test|spec)\.[cm]?[jt]sx?$''',
]
regexes = [
  '''(?i)(?:test|fake|dummy|example|sample|placeholder|wrong|not_a_real|invalid|bogus|mock)''',
  '''(?:0{8,}|1{8,}|2{8,}|3{8,}|4{8,}|5{8,}|6{8,}|7{8,}|8{8,}|9{8,}|(?i:x{8,}|z{8,}|a{8,}))''',
]

